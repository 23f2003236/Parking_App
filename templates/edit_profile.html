{% extends 'base.html' %}

{% block title %}Edit Profile - Vehicle Parking System{% endblock %}

{% block content %}
<h1 class="mb-4">
    <i class="fas fa-user-edit text-primary me-2"></i>Edit Your Profile
</h1>
<form method="POST" action="{{ url_for('edit_profile') }}">
    
    <!-- Username is locked(disabled for now ) -->
    <div class="mb-3">
        <label for="username" class="form-label">
            <i class="fas fa-user me-1"></i>Username
        </label>
        <input type="text" class="form-control" id="username" value="{{ current_user.username }}" disabled>
        <div class="form-text text-muted">Username cannot be changed.</div>
    </div>

    <!-- Editable Email -->
    <div class="mb-3">
        <label for="email" class="form-label">
            <i class="fas fa-envelope me-1"></i>Email Address
        </label>
        <input type="email" class="form-control" id="email" name="email" value="{{ current_user.email }}">
    </div>

    <!-- Password Fields -->
    <div class="mb-3">
        <label for="password" class="form-label">
            <i class="fas fa-lock me-1"></i>New Password
        </label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Leave blank to keep current password">
    </div>
    
    <!-- Confirm Password Field -->
    <div class="mb-3">
        <label for="confirm_password" class="form-label">
            <i class="fas fa-lock me-1"></i>Confirm Password
        </label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password">
    </div>

    <button type="submit" class="btn btn-primary">
        <i class="fas fa-save me-2"></i>Save Changes
    </button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">
        <i class="fas fa-times me-2"></i>Cancel
    </a>
</form>
{% endblock %}
